
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Search</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<nav class="navbar navbar-dark brand-bg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">TravelGo</a>

        <button class="btn btn-light d-md-none"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#sidebar">
            Filters
        </button>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">

        <!-- Desktop Filters -->
        <aside class="col-md-3 d-none d-md-block">
            <div class="card p-3">
                <h5>Flight Filters</h5>

                <label>Maximum Price:
                    ₹<span data-price-output>8000</span>
                </label>

                <input type="range" class="form-range"
                       min="3000" max="8000" value="8000"
                       step="100" data-price>

                <h6 class="mt-3">Maximum Stops</h6>
                <select class="form-select" data-stops>
                    <option value="2">All Stops</option>
                    <option value="1">1 Stop</option>
                    <option value="0">Non-stop</option>
                </select>

                <h6 class="mt-3">Airlines</h6>

                <div><input type="checkbox" data-airline="IndiGo" checked> IndiGo</div>
                <div><input type="checkbox" data-airline="Air India" checked> Air India</div>
                <div><input type="checkbox" data-airline="SpiceJet" checked> SpiceJet</div>
                <div><input type="checkbox" data-airline="Vistara" checked> Vistara</div>
                <div><input type="checkbox" data-airline="Akasa Air" checked> Akasa Air</div>
            </div>
        </aside>

        <!-- Mobile Filters -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar">
            <div class="offcanvas-header">
                <h5>Flight Filters</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="offcanvas"></button>
            </div>

            <div class="offcanvas-body">
                <label>Maximum Price:
                    ₹<span data-price-output>8000</span>
                </label>

                <input type="range" class="form-range"
                       min="3000" max="8000" value="8000"
                       step="100" data-price>

                <h6 class="mt-3">Maximum Stops</h6>
                <select class="form-select" data-stops>
                    <option value="2">All Stops</option>
                    <option value="1">1 Stop</option>
                    <option value="0">Non-stop</option>
                </select>

                <h6 class="mt-3">Airlines</h6>

                <div><input type="checkbox" data-airline="IndiGo" checked> IndiGo</div>
                <div><input type="checkbox" data-airline="Air India" checked> Air India</div>
                <div><input type="checkbox" data-airline="SpiceJet" checked> SpiceJet</div>
                <div><input type="checkbox" data-airline="Vistara" checked> Vistara</div>
                <div><input type="checkbox" data-airline="Akasa Air" checked> Akasa Air</div>
            </div>
        </div>

        <!-- Flight Results -->
        <section class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h2>Available Flights</h2>

                <select class="form-select" data-sort style="width: 220px;">
                    <option value="default">Sort By</option>
                    <option value="price">Lowest Price</option>
                    <option value="departure">Earliest Departure</option>
                </select>
            </div>

            <p id="flightCount"></p>

            <div class="row g-3" id="flightList">
                <!-- JavaScript displays flight cards here -->
            </div>
        </section>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../Flight-search/main.js"></script>

</body>
</html>
