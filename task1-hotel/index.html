<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Find Your Perfect Stay</h1>
    </header>

    <main>
        <section class="hotel-container">

    <div class="hotel-card">
        <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=500" alt="Luxury hotel">
        <div class="hotel-details">
            <h2>Grand Palace Hotel</h2>
            <p>Bangalore, India</p>
            <p>₹4,500 / night</p>
            <button>Book Now</button>
        </div>
    </div>

    <div class="hotel-card">
        <img src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=500" alt="Resort">
        <div class="hotel-details">
            <h2>Ocean View Resort</h2>
            <p>Goa, India</p>
            <p>₹5,500 / night</p>
            <button>Book Now</button>
        </div>
    </div>

    <div class="hotel-card">
        <img src="https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=500" alt="Hotel">
        <div class="hotel-details">
            <h2>Royal Stay</h2>
            <p>Chennai, India</p>
            <p>₹3,500 / night</p>
            <button>Book Now</button>
        </div>
    </div>

        </section>
    </main>

</body>
</html>
